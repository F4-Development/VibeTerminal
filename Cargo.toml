[package]
name = "vibeterminal"
version = "0.1.1"
edition = "2024"
description = "VibeTerminal — терминальный пульт для вайбкодинга с Claude Code"

[[bin]]
name = "vv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
libc = "0.2.189"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
vt100 = "0.16.2"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[profile.release]
lto = "thin"
strip = true
