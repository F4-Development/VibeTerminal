[package]
name = "vibevim"
version = "0.1.0"
edition = "2024"
description = "Vibe Vim — терминальный пульт для вайбкодинга с Claude Code"

[[bin]]
name = "vv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
portable-pty = "0.9.0"
ratatui = "0.30.2"
vt100 = "0.16.2"

[profile.release]
lto = "thin"
strip = true
