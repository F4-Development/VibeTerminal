[package]
name = "vibeterminal"
version = "0.1.0"
edition = "2024"
description = "VibeTerminal — терминальный пульт для вайбкодинга с Claude Code"

[[bin]]
name = "vv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde_json = "1.0.151"
signal-hook = "0.4.4"
vt100 = "0.16.2"

[profile.release]
lto = "thin"
strip = true
